    <!-- Application JavaScript Logic -->
    <script>
        const ADSTERRA_SMARTLINK = "https://ardance.org/4/325898d389dde0628cb663bc9622c1ca";
        let currentExtractedData = { thumb: '', title: '', caption: '', rawUrl: '' };

        function triggerSmartlink() {
            if (ADSTERRA_SMARTLINK) {
                window.open(ADSTERRA_SMARTLINK, '_blank');
            }
        }

        async function fetchMedia() {
            const rawUrl = document.getElementById('videoUrl').value.trim();
            if (!rawUrl) {
                showAlert('Kripya valid Instagram, YouTube ya X link paste karein!', 'bg-red-900/50 text-red-200 border border-red-700');
                return;
            }

            hideAlert();
            triggerSmartlink(); // Smartlink popunder trigger on click

            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            
            loader.classList.remove('hidden');
            resultCard.classList.add('hidden');

            try {
                let parsedTitle = "HD Video Stream";
                let parsedCaption = `Original Media Link: ${rawUrl}\n\nProcessed & Ready for 1080p HD Download.`;
                let parsedThumb = "https://picsum.photos/400/250";

                // YouTube thumbnail & ID parser
                if (rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be')) {
                    let vId = '';
                    if (rawUrl.includes('youtu.be/')) vId = rawUrl.split('youtu.be/')[1].split('?')[0];
                    else if (rawUrl.includes('shorts/')) vId = rawUrl.split('shorts/')[1].split('?')[0];
                    else if (rawUrl.includes('v=')) vId = rawUrl.split('v=')[1].split('&')[0];
                    
                    if (vId) parsedThumb = `https://img.youtube.com/vi/${vId}/maxresdefault.jpg`;
                    parsedTitle = "YouTube HD Video (" + (vId || "Media") + ")";
                } 
                else if (rawUrl.includes('instagram.com')) {
                    parsedTitle = "Instagram Reel / Video";
                } 
                else if (rawUrl.includes('twitter.com') || rawUrl.includes('x.com')) {
                    parsedTitle = "X (Twitter) Video Post";
                }

                currentExtractedData = {
                    thumb: parsedThumb,
                    title: parsedTitle,
                    caption: parsedCaption,
                    rawUrl: rawUrl
                };

                loader.classList.add('hidden');
                resultCard.classList.remove('hidden');

                document.getElementById('mediaTitle').innerText = parsedTitle;
                document.getElementById('mediaCaption').innerText = parsedCaption;
                document.getElementById('mediaThumbnail').src = parsedThumb;

            } catch (e) {
                loader.classList.add('hidden');
                showAlert('Processing error. Kripya URL verify karke try karein.', 'bg-red-900/50 text-red-200 border border-red-700');
            }
        }

        // Guaranteed Video/Audio/Thumbnail Download Routing
        function downloadAction(type) {
            triggerSmartlink(); // Open Adsterra Smartlink Ad

            const link = currentExtractedData.rawUrl || document.getElementById('videoUrl').value.trim();
            if (!link) {
                alert('Pehle Fetch Media click karke stream load karein!');
                return;
            }

            if (type === 'thumb') {
                window.open(currentExtractedData.thumb, '_blank');
            } else if (type === 'audio') {
                // Audio bridge proxy
                const audioBridge = "https://cobalt.tools/#" + encodeURIComponent(link);
                window.open(audioBridge, '_blank');
            } else {
                // HD Video bridge proxy (Bypasses CORS & Browser Blocks)
                const videoBridge = "https://cobalt.tools/#" + encodeURIComponent(link);
                window.open(videoBridge, '_blank');
            }
        }

        // Guaranteed Clipboard Copy Solution
        function copyContent(elementId) {
            const text = document.getElementById(elementId).innerText;
            if (!text) return;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showAlert('Copied to clipboard!', 'bg-emerald-900/50 text-emerald-200 border border-emerald-700');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const el = document.createElement('textarea');
            el.value = text;
            el.style.position = 'fixed';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            try {
                document.execCommand('copy');
                showAlert('Copied to clipboard!', 'bg-emerald-900/50 text-emerald-200 border border-emerald-700');
            } catch (err) {
                alert('Manual copy karein.');
            }
            document.body.removeChild(el);
        }

        function showAlert(msg, classes) {
            const box = document.getElementById('alertBox');
            box.className = `p-4 mb-4 rounded-xl text-sm font-medium ${classes}`;
            box.innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        const modalPages = {
            privacy: `
                <h2 class="text-xl font-bold text-white mb-2">Privacy Policy</h2>
                <p>MediaGrab HD does not log or store personal files or history. We use third-party ad networks (Adsterra, Monetag).</p>
            `,

                <p>This tool is for personal caching & backups only. Please respect creator rights.</p>
            `,
            dmca: `
                <h2 class="text-xl font-bold text-white mb-2">DMCA Disclaimer</h2>
                <p>We do not host copyrighted files on our servers.</p>
            `,
            contact: `
                <h2 class="text-xl font-bold text-white mb-2">Contact Us</h2>
                <form onsubmit="event.preventDefault(); alert('Message Sent!'); closeModal();" class="space-y-3">
                    <input type="email" required placeholder="Your Email Address" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                    <textarea required placeholder="Your Message..." rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white"></textarea>
                    <button type="submit" class="bg-indigo-600 text-white font-medium py-2 px-6 rounded-lg text-sm">Send Message</button>
                </form>
            `
        };

        function openModal(page) {
            document.getElementById('modalContent').innerHTML = modalPages[page];
            document.getElementById('complianceModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('complianceModal').classList.add('hidden');
        }
